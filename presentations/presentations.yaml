  content: |
    In August, I was invited to contribute a virtual presentation to the [Foresight Training for Anticipatory Adaptation in the Hindu Kush Himalaya](https://www.icimod.org/event/livelihoods-economies/foresight-training-for-anticipatory-adaptation-in-the-hindu-kush-himalaya/) event, organised by the
